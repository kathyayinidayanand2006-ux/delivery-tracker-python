apiVersion: v1
kind: Service
metadata:
  name: delivery-tracker
  namespace: stage
spec:
  ports:
    - name: http
      port: 8080
      targetPort: http
  selector:
    app: delivery-tracker
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: stage
spec:
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
  selector:
    app: postgres
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: stage
spec:
  ports:
    - name: redis
      port: 6379
      targetPort: redis
  selector:
    app: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: delivery-tracker
  namespace: stage
  labels:
    app: delivery-tracker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: delivery-tracker
  template:
    metadata:
      labels:
        app: delivery-tracker
    spec:
      imagePullSecrets:
        - name: dockerhub
      initContainers:
        - name: migrate
          image: docker.io/kathyayinidayanand2006/delivery-tracker-python:stage
          imagePullPolicy: Always
          command: ["python", "-m", "app.migrate"]
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tracker-db
                  key: password
            - name: DATABASE_URL
              value: postgresql://tracker:$(DB_PASSWORD)@postgres:5432/tracker
      containers:
        - name: app
          image: docker.io/kathyayinidayanand2006/delivery-tracker-python:stage
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tracker-db
                  key: password
            - name: DATABASE_URL
              value: postgresql://tracker:$(DB_PASSWORD)@postgres:5432/tracker
            - name: REDIS_URL
              value: redis://redis:6379/0
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: stage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7
          ports:
            - containerPort: 6379
              name: redis
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 10
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: stage
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_USER
              value: tracker
            - name: POSTGRES_DB
              value: tracker
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tracker-db
                  key: password
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "tracker", "-d", "tracker"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "tracker", "-d", "tracker"]
            periodSeconds: 10
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
